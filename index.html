<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="杯测" />
<meta name="application-name" content="杯测" />
<meta name="format-detection" content="telephone=no" />
<title>咖啡杯测 · Cupping</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="stylesheet" href="/styles.css" />
<!-- iOS 主屏启动图：按设备精确匹配，避免打开时全白闪一下 -->
<script>
  /* 非中文界面：首帧前先隐藏，等 i18n.js 译完再显示，避免中文闪一下 */
  try {
    var lg = localStorage.getItem("cupping.lang");
    if (lg && lg !== "zh") {
      document.documentElement.classList.add("i18n-pending");
      document.documentElement.lang = lg;
    }
  } catch (e) {}
</script>
<style>html.i18n-pending body { visibility: hidden; }</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div id="app"></div>
<div id="layer"></div>
<footer class="site-credit">
  <button type="button" class="credit-link" data-act="about">关于 · 免责声明</button>
  <span class="credit-sep">|</span><span>Design by Benson Qiu</span>
</footer>
<input id="filePicker" type="file" accept="image/*" multiple hidden />
<script src="/gate-config.js"></script>
<script src="/gate.js"></script>
<script src="/local-backend.js"></script>
<script src="/i18n.js"></script>
<script src="/picker.js"></script>
<script src="/app.js"></script>
<script>
  /* 注册离线缓存：「添加到主屏幕」之后断网也能打开。
     只在安全上下文（https / localhost）生效，局域网 http 下浏览器会静默忽略。 */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }

  /* 独立窗口模式下给 body 加类，样式里用来补顶部安全区 */
  if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
    document.documentElement.classList.add("standalone");
  }
</script>

<script>
/* 首次用手机浏览器打开时，提示「添加到主屏幕」；装好（standalone）后不再出现。 */
(function () {
  try {
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (standalone) return;
    if (localStorage.getItem("cupping.installed.tip") === "1") return;
    var ua = navigator.userAgent;
    var iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var msg = iOS
      ? "在 Safari 点底部的「分享」按钮，选「添加到主屏幕」，之后就能像 App 一样离线使用。"
      : "在浏览器菜单里选「添加到主屏幕 / 安装应用」，之后就能像 App 一样离线使用。";
    var box = document.createElement("div");
    box.setAttribute("data-install-tip", "1");
    box.style.cssText = "position:fixed;left:12px;right:12px;bottom:14px;z-index:90;background:#111;color:#fff;border-radius:12px;padding:13px 14px;font:13.5px/1.5 -apple-system,system-ui,'PingFang SC',sans-serif;display:flex;gap:10px;align-items:flex-start";
    box.innerHTML = '<div style="flex:1">' + msg + "</div>" +
      '<button type="button" style="flex:none;background:transparent;border:0;color:#9a9aa0;font-size:18px;line-height:1;padding:0 2px">×</button>';
    box.querySelector("button").addEventListener("click", function () {
      try { localStorage.setItem("cupping.installed.tip", "1"); } catch (e) {}
      box.remove();
    });
    document.documentElement.appendChild(box);
  } catch (e) {}
})();
</script>
</body>
</html>
